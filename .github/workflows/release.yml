name: Windows installer release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version tag (example v0.2.0-alpha.22)
        required: true
        default: v0.2.0-alpha.22
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Choose version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $tag = $env:GITHUB_REF_NAME } elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $tag = '${{ inputs.version }}' } else { $tag = 'v0.2.0-alpha.22' }
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$') { throw "Invalid version" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "number=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT
      - name: Check existing release
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $tags = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName --jq '.[].tagName'
          if ($LASTEXITCODE -ne 0) { throw 'Could not list releases' }
          if ($tags -contains $env:TAG) { "exists=true" >> $env:GITHUB_OUTPUT } else { "exists=false" >> $env:GITHUB_OUTPUT }
      - name: Build Windows application
        if: steps.existing.outputs.exists == 'false'
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release
      - name: Bundle FFmpeg runtime
        if: steps.existing.outputs.exists == 'false'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip'
          Invoke-WebRequest -Uri $url -OutFile ffmpeg-package.zip
          Expand-Archive ffmpeg-package.zip -DestinationPath ffmpeg-extracted
          $root = Get-ChildItem ffmpeg-extracted -Directory | Select-Object -First 1
          if (-not $root) { throw 'FFmpeg archive missing directory' }
          New-Item -ItemType Directory -Force vendor/ffmpeg | Out-Null
          Copy-Item "$($root.FullName)/*" vendor/ffmpeg -Recurse -Force
          if (-not (Test-Path vendor/ffmpeg/bin/ffmpeg.exe)) { throw 'FFmpeg binary missing' }
          & vendor/ffmpeg/bin/ffmpeg.exe -hide_banner -version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled FFmpeg failed validation' }
          Get-FileHash ffmpeg-package.zip -Algorithm SHA256 | Format-List
      - name: Prepare portable ZIP
        if: steps.existing.outputs.exists == 'false'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          New-Item -ItemType Directory -Force dist/LiteSR | Out-Null
          Copy-Item build/Release/LiteSR.exe,build/Release/litesr.exe,README.md dist/LiteSR/
          Copy-Item vendor/ffmpeg dist/LiteSR/ffmpeg -Recurse -Force
          Copy-Item updater dist/LiteSR/updater -Recurse -Force
          Compress-Archive dist/LiteSR "dist/LiteSR-$env:VERSION-Portable-x64.zip"
      - name: Install Inno Setup
        if: steps.existing.outputs.exists == 'false'
        run: choco install innosetup --yes --no-progress
      - name: Compile Windows installer
        if: steps.existing.outputs.exists == 'false'
        shell: pwsh
        env:
          LITESR_VERSION: ${{ steps.version.outputs.number }}
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer\LiteSR.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Checksums
        if: steps.existing.outputs.exists == 'false'
        shell: pwsh
        run: |
          Get-ChildItem dist -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        if: steps.existing.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          $args = @('release','create',$env:TAG,"dist/LiteSR-$env:VERSION-Setup-x64.exe","dist/LiteSR-$env:VERSION-Portable-x64.zip",'dist/SHA256SUMS.txt','--repo',$env:GITHUB_REPOSITORY,'--target',$env:GITHUB_SHA,'--title',"LiteSR $env:TAG",'--generate-notes')
          if ($env:VERSION.Contains('-')) { $args += '--prerelease' }
          gh @args
