name: Publish LiteSR release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Main branch may bootstrap first alpha release only; further releases use version tags.
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Choose release version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            "tag=$env:GITHUB_REF_NAME" >> $env:GITHUB_OUTPUT
          } else {
            "tag=v0.1.0-alpha.1" >> $env:GITHUB_OUTPUT
          }
      - name: Check for existing release
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT }
          else { "exists=false" >> $env:GITHUB_OUTPUT }
      - name: Configure
        if: steps.existing.outputs.exists == 'false'
        run: cmake -S . -B build -A x64
      - name: Compile
        if: steps.existing.outputs.exists == 'false'
        run: cmake --build build --config Release
      - name: Package release
        if: steps.existing.outputs.exists == 'false'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          New-Item -ItemType Directory -Force -Path dist/LiteSR | Out-Null
          Copy-Item build/Release/litesr.exe dist/LiteSR/litesr.exe
          Copy-Item README.md dist/LiteSR/README.md
          @'
          LiteSR experimental Windows prototype.
          Run from PowerShell or CMD. FFmpeg must be installed separately and on PATH.
          Try: litesr.exe --help
          Recording/streaming is command-line only; no audio or GUI yet.
          '@ | Set-Content dist/LiteSR/START-HERE.txt
          Compress-Archive -Path dist/LiteSR -DestinationPath "LiteSR-$env:RELEASE_TAG-windows-x64.zip"
      - name: Publish GitHub release
        if: steps.existing.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $notes = @'
          Early testing build of LiteSR (Windows x64).
          Includes a C++ FFmpeg launcher with desktop MP4 recording and RTMP/RTMPS streaming.
          Requires FFmpeg installed on PATH. No GUI or audio yet; capture uses gdigrab and has NOT been optimized for low-end hardware.
          Try Intel QSV (--encoder qsv), or software fallback (--encoder cpu).
          No guarantee of reduced in-game FPS impact.
          '@
          $notes | Set-Content release-notes.txt
          gh release create $env:RELEASE_TAG "LiteSR-$env:RELEASE_TAG-windows-x64.zip" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "LiteSR $env:RELEASE_TAG" --notes-file release-notes.txt --prerelease
